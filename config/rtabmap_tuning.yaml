# RTAB-Map 저텍스처(균일한 콘크리트 교량 하부) 강건성 튜닝.
#
# docs/bridge_drone_project_summary.md 8번 항목 3에 기록된 위험 요소
# ("텍스처 없는 콘크리트 표면 = Visual SLAM 실패의 전형적 조건")에 대한
# 대응. 2026-08-12에 젯슨의 rgbd_odometry/rtabmap 노드에서 `ros2 param
# describe/get`으로 실제 기본값을 직접 조회해서 확인한 값 기준으로,
# 근거 있는 파라미터만 조정 — 무작정 다 바꾸지 않음.
#
# 손대지 않은 것들(이미 적절한 기본값으로 확인됨):
#   GFTT/QualityLevel(0.001) — 이미 매우 관대한 코너 검출 임계값
#   GFTT/MinDistance(7) — RTAB-Map 문서의 권장값과 일치
#   Vis/MaxFeatures(1000) — 이미 넉넉함, 더 늘리면 8GB 젯슨에서 YOLO와
#     동시 구동 시 연산 부담 커질 위험(2026-07-12 학습 중 OOM 인시던트 참고)
#   Vis/FeatureType(8, GFTT 기반) — 이미 저텍스처에 유리한 GFTT 계열
#
# 라이브 검증 전까지는 이 값들도 추정일 뿐 — 실제 콘크리트 표면에서
# 트래킹이 얼마나 개선되는지는 다음 하드웨어 세션에서 카메라를 움직여야
# 확인 가능(8번 항목 3, 라이브 SLAM 검증에 종속).
#
# 파라미터 의미를 확인하는 올바른 방법(2026-08-20에 배운 것):
#   `ros2 param describe`는 RTAB-Map 파라미터의 **설명 필드가 비어서 나옴**
#   (ROS 래퍼가 description을 안 채움 — 타입/제약만 보임). 그래서 8/12엔
#   이름·기본값만 노드에서 확인하고 값의 *의미*는 웹 문서에 의존했는데,
#   거기서 Odom/Strategy의 0/1이 뒤바뀐 채로 기록됐음(아래 참고).
#   값의 의미까지 확실히 보려면 설치된 라이브러리에 직접 물어볼 것:
#       source /opt/ros/humble/setup.bash
#       rtabmap-export --params | grep -i '<파라미터명>'
#   (GUI `rtabmap --params`는 헤드리스 젯슨에서 Qt 플러그인 에러로 실패함)

/rgbd_odometry:
  ros__parameters:
    # Frame-to-Map(0). 최근 키프레임들의 누적 로컬 맵과 비교하므로 특징점이
    # 일시적으로 부족한 구간을 지나가도 이전에 본 특징점으로 복구가 쉬움 —
    # 직전 프레임하고만 비교하는 Frame-to-Frame(1)보다 저텍스처에 훨씬 강건.
    #
    # 2026-08-20 정정: 8/12에 이 값을 "1"로 설정하면서 주석에 "기본 0=F2F를
    # 1=F2M으로 바꿈"이라고 적어뒀는데, 실제 의미가 정반대였음. 설치된
    # librtabmap_core에 직접 물어본 결과(`rtabmap-export --params`):
    #   Odom/Strategy = "0"  [0=Frame-to-Map (F2M) 1=Frame-to-Frame (F2F) ...]
    # 즉 기본값 0이 이미 F2M(강한 쪽)이었는데 우리가 F2F(약한 쪽)로 바꿔놓고
    # 있었음. 8/13 라이브 테스트에서 트래킹이 유독 불안해 Vis/MinInliers를
    # 8까지 낮춰야 했던 것도 이것 때문일 가능성이 큼. F2M으로 되돌림.
    Odom/Strategy: "0"
    # F2M 로컬 맵에 유지하는 특징점 수. 기본(2000)보다 소폭 늘려서 더 오래
    # 전에 본 특징점도 기억하게 함 — 다만 젯슨 메모리 여유를 고려해 과하게
    # 늘리지 않음(50% 증가 선). 위 Strategy 정정 전까지는 F2M 자체가 꺼져
    # 있어서 이 값이 실제로는 아무 효과도 없었음.
    OdomF2M/MaxSize: "3000"
    # 트래킹 인라이어 최소 개수. 기본 20은 특징점이 풍부한 환경 기준이라
    # 저텍스처에서는 이 문턱을 못 넘어 트래킹을 완전히 놓치기 쉬움.
    # 2026-08-13 라이브 테스트(젯슨+D455F, 실내 사무실 환경): 15로도
    # 매 프레임 등록 실패(inlier 0, 가끔 6~10)가 계속돼서 8로 재조정.
    Vis/MinInliers: "8"
    # 연속 등록 실패가 N번 넘으면 오도메트리를 자동 리셋. 8/13에 발견한
    # "카메라 정지 중 모션 예측(guess)이 488m까지 발산해서 영원히 복구
    # 불가"가 되는 상황을 스스로 벗어나기 위해 도입.
    #
    # 2026-08-20 정정 1 → 10: 리셋의 부작용을 8/19 실측으로 확인함.
    # 공식 설명(`rtabmap-export --params`):
    #   "...odometry resumes from the last successfully computed pose with
    #    large covariance to trigger a new map."
    # 즉 리셋 = 새 지도(map_id) 생성. 1로 두면 단 한 프레임만 등록에
    # 실패해도 즉시 지도가 갈라짐 — 8/19 연필꽂이 스캔에서 9번 리셋되며
    # 노드 749개가 8개 map_id로 조각나 rtabmap-export가 제대로 된 재구성을
    # 못 만든 직접적 원인. 10이면 순간적인 트래킹 끊김은 견디면서(지도 유지)
    # 진짜 발산 상황에서는 여전히 자동 복구됨.
    Odom/ResetCountdown: "10"

/rtabmap:
  ros__parameters:
    # 루프클로징 시각 검증에도 같은 인라이어 완화를 동일하게 적용
    # (오도메트리와 다른 기준을 쓰면 트래킹은 됐는데 루프클로저만
    # 계속 거부되는 불일치가 생길 수 있어서 맞춰둠).
    Vis/MinInliers: "8"
    # 기본은 그래프가 크게 갱신될 때만(루프클로저 등) /cloud_map 등
    # 맵 토픽을 발행 — 2026-08-13 실측에서 루프클로저가 계속 거부돼
    # 맵 토픽이 한 번도 안 나옴. 매 업데이트마다 발행하도록 켜서
    # 실시간 3D 누적 확인이 가능하게 함(젯슨 부하는 계속 지켜볼 것).
    # 주의: 이건 RTAB-Map 내부 Parameters(전부 문자열)가 아니라 ROS2
    # 네이티브 파라미터라 실제 bool이어야 함(문자열 "true"는 타입 에러로
    # 노드가 죽음 — 2026-08-13 실측으로 확인).
    map_always_update: true

    # --- 고스팅(같은 표면이 여러 겹으로 어긋나 쌓이는 현상) 대응, 2026-08-20 ---
    # 8/20 벽 스캔 결과에서 평면 두께 분포에 봉우리가 2개(26mm 간격)로
    # 갈리는 게 실측됨 = 같은 벽이 두 겹으로 쌓임. 전역 번들 조정(rtabmap-export
    # --ba)만으로도 한 겹(σ 29.3→20.7mm)으로 합쳐졌지만, 그건 export 단계의
    # 후처리라 지도 자체는 그대로임. 아래는 지도를 만드는 단계에서 정합을
    # 개선하려는 시도.
    #
    # 결론: ICP 정합은 이 장면에서 쓸 수 없음 — 아래는 시도했다가 되돌린 기록.
    # 다시 켜보려는 사람이 같은 함정에 빠지지 않도록 남겨둠.
    #
    # 시도한 것: Reg/Strategy를 기본 0(Vis, 시각 특징점만)에서 2(VisIcp,
    # 시각 정합 후 ICP로 형상까지 맞춤)로 바꾸면 표면 정합이 더 정확해질 것으로
    # 기대했음. 곁들여 RGBD/NeighborLinkRefining("true")과 Icp/VoxelSize("0.02")도
    # 함께 시도.
    #
    # 실제 결과(2026-08-20, 같은 bag으로 A/B): **지도가 아예 안 만들어짐.**
    # rtabmap이 27번 반복을 돌 동안 WM(working memory)이 1에 고정 — 노드가
    # 하나도 추가되지 않음. 오도메트리 자체는 멀쩡했음(quality 579~599,
    # rgbd_odometry는 icpParams_=0이라 애초에 ICP를 안 씀).
    # 범인을 좁히려고 NeighborLinkRefining만 false로 되돌려 재실험했지만
    # 결과 동일 → **Reg/Strategy=2 자체가 원인**.
    #
    # 추정 원인(미확증): 평평한 벽 한 면은 ICP의 전형적인 퇴화(degenerate)
    # 조건 — 평면을 따라 미끄러져도 점-평면 오차가 줄지 않아 변환이 확정되지
    # 않는다. 사실이라면 **콘크리트 교량 하부에서도 똑같이 실패**한다는 뜻이라,
    # 이 프로젝트에서는 ICP 계열 정합을 기본 후보에서 빼는 게 맞다.
    #
    # 대신 고스팅은 export 단계의 전역 번들 조정으로 해결함(rtabmap-export --ba):
    # 평면 두께 봉우리 2개(26mm 간격) → 1개, σ 29.3mm → 20.7mm.
    # Reg/Strategy는 기본값 0(Vis)을 그대로 쓰므로 여기서 지정하지 않는다.
