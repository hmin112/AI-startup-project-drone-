<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Bridge Drone Dashboard</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #12161c; color: #e6e6e6; margin: 0; padding: 24px; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  #status { font-size: 0.85rem; margin-bottom: 16px; }
  #status.connected { color: #4ade80; }
  #status.disconnected { color: #f87171; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #2a2f38; }
  th { color: #9ca3af; font-weight: 600; }
  #empty { color: #6b7280; padding: 16px 0; }
  #camera { max-width: 100%; border-radius: 8px; border: 1px solid #2a2f38; margin-bottom: 20px; display: block; }
  #camera-empty { color: #6b7280; margin-bottom: 20px; }
  h2 { font-size: 1rem; color: #9ca3af; margin: 0 0 8px; }
  #drone-status { display: flex; gap: 16px; flex-wrap: wrap; background: #181d25; border: 1px solid #2a2f38;
    border-radius: 8px; padding: 10px 14px; margin-bottom: 20px; font-size: 0.9rem; }
  #drone-status .item { display: flex; gap: 6px; align-items: baseline; }
  #drone-status .label { color: #9ca3af; }
  #drone-status .value { font-weight: 600; }
  #drone-status .value.ok { color: #4ade80; }
  #drone-status .value.bad { color: #f87171; }
  #drone-status .value.warn { color: #fbbf24; }
</style>
</head>
<body>
  <h1>Bridge Drone Dashboard</h1>
  <div id="status" class="disconnected">연결 중...</div>

  <h2>드론 상태</h2>
  <div id="drone-status">
    <div class="item"><span class="label">연결</span><span id="drone-connected" class="value bad">-</span></div>
    <div class="item"><span class="label">Armed</span><span id="drone-armed" class="value">-</span></div>
    <div class="item"><span class="label">모드</span><span id="drone-mode" class="value">-</span></div>
    <div class="item"><span class="label">배터리</span><span id="drone-battery" class="value">-</span></div>
  </div>

  <h2>실시간 카메라</h2>
  <img id="camera" alt="실시간 카메라 화면">
  <div id="camera-empty">아직 수신된 프레임이 없습니다.</div>

  <h2>탐지 결과</h2>
  <table>
    <thead>
      <tr><th>class</th><th>confidence</th><th>length (mm)</th><th>width (mm)</th><th>bbox</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty">아직 수신된 탐지 결과가 없습니다.</div>

<script>
  const statusEl = document.getElementById('status');
  const rowsEl = document.getElementById('rows');
  const emptyEl = document.getElementById('empty');
  const cameraEl = document.getElementById('camera');
  const cameraEmptyEl = document.getElementById('camera-empty');
  const droneConnectedEl = document.getElementById('drone-connected');
  const droneArmedEl = document.getElementById('drone-armed');
  const droneModeEl = document.getElementById('drone-mode');
  const droneBatteryEl = document.getElementById('drone-battery');
  const WS_PORT = 8765;
  cameraEl.style.display = 'none';
  let lastFrameUrl = null;

  function connect() {
    const ws = new WebSocket(`ws://${location.hostname}:${WS_PORT}`);

    ws.onopen = () => {
      statusEl.textContent = '연결됨';
      statusEl.className = 'connected';
    };
    ws.onclose = () => {
      statusEl.textContent = '연결 끊김 - 재시도 중...';
      statusEl.className = 'disconnected';
      setTimeout(connect, 2000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (event) => {
      if (event.data instanceof Blob) {
        renderFrame(event.data);
        return;
      }
      let parsed;
      try {
        parsed = JSON.parse(event.data);
      } catch {
        return;
      }
      if (Array.isArray(parsed)) {
        render(parsed);
      } else {
        renderDroneStatus(parsed);
      }
    };
  }

  function renderDroneStatus(status) {
    droneConnectedEl.textContent = status.connected ? '연결됨' : '연결 안 됨';
    droneConnectedEl.className = 'value ' + (status.connected ? 'ok' : 'bad');

    droneArmedEl.textContent = status.armed ? 'ARMED' : 'disarmed';
    droneArmedEl.className = 'value ' + (status.armed ? 'warn' : 'ok');

    droneModeEl.textContent = status.mode || '-';

    const pct = status.battery_percentage;
    droneBatteryEl.textContent = (pct === null || pct === undefined) ? '-' : `${(pct * 100).toFixed(0)}%`;
  }

  function renderFrame(blob) {
    const url = URL.createObjectURL(blob);
    const previousUrl = lastFrameUrl;
    lastFrameUrl = url;
    cameraEl.onload = () => {
      if (previousUrl) URL.revokeObjectURL(previousUrl);
    };
    cameraEl.src = url;
    cameraEl.style.display = 'block';
    cameraEmptyEl.style.display = 'none';
  }

  function render(detections) {
    rowsEl.innerHTML = '';
    emptyEl.style.display = detections.length ? 'none' : 'block';
    for (const d of detections) {
      const fmt = (v) => (v === null || v === undefined) ? '-' : (typeof v === 'number' ? v.toFixed(1) : v);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${fmt(d.class)}</td>
        <td>${fmt(d.confidence)}</td>
        <td>${fmt(d.length_mm)}</td>
        <td>${fmt(d.width_mm)}</td>
        <td>${(d.bbox || []).join(', ')}</td>
      `;
      rowsEl.appendChild(tr);
    }
  }

  connect();
</script>
</body>
</html>
